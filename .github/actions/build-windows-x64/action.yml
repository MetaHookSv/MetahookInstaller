name: Build Windows x64 Release
description: Restore, build, test and package the MetahookInstaller GUI and CLI.

outputs:
  archive-path:
    description: Absolute path to the Windows x64 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      shell: cmd
      run: dotnet restore MetahookInstaller.sln

    - name: Build
      shell: cmd
      run: dotnet build MetahookInstaller.sln -c Release --no-restore

    - name: Test
      shell: cmd
      run: dotnet run --project tests\MetahookInstaller.FileTests -c Release --no-build

    - name: Publish
      shell: cmd
      run: dotnet publish src\MetahookInstallerAvalonia.Desktop\MetahookInstallerAvalonia.Desktop.csproj -p:PublishProfile=FolderProfile -o MetahookInstaller-Output

    - name: Publish CLI (single file)
      shell: cmd
      run: dotnet publish src\MetahookInstallerCLI\MetahookInstallerCLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=true -p:DebugType=None -p:DebugSymbols=false -o build\cli-publish

    - name: Prepare output
      shell: pwsh
      run: |
        Move-Item -LiteralPath 'MetahookInstaller-Output\MetahookInstallerAvalonia.Desktop.exe' -Destination 'MetahookInstaller-Output\MetahookInstaller.exe' -Force
        $cliFiles = @(Get-ChildItem -LiteralPath 'build\cli-publish' -Recurse -File)
        if ($cliFiles.Count -ne 1 -or $cliFiles[0].Name -ne 'MetahookInstallerCLI.exe') {
          throw 'CLI publish must contain exactly one self-contained executable.'
        }
        Copy-Item -LiteralPath $cliFiles[0].FullName -Destination 'MetahookInstaller-Output'
        Copy-Item -LiteralPath 'README.md', 'LICENSE' -Destination 'MetahookInstaller-Output'

    - name: Package
      id: package
      shell: pwsh
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'MetahookInstaller-windows-x64.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'MetahookInstaller-Output\*' -r '-x!*.pdb'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((Get-Item -LiteralPath $archivePath).Length -eq 0) {
          throw "Missing or empty archive: $archivePath"
        }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
